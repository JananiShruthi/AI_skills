<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schema explorer</title>
<style>
:root{font:14px/1.45 system-ui,sans-serif;color:#e9f2fc;background:#0a1423}*{box-sizing:border-box}body{margin:0}h1,h2,h3,p{margin:0 0 8px}h1{font-size:24px}h2{font-size:18px}h3{font-size:14px;color:#bad3e9}p,.muted{color:#aec3d8}header,.story{padding:18px 22px;border-bottom:1px solid #344c67;background:#102139}.meta{font-size:12px;color:#abc1d7}.warn{background:#5a3329;padding:9px;border-radius:7px}.steps{display:flex;gap:13px;overflow-x:auto;padding:3px 0 8px}.step{flex:1 0 200px;max-width:275px;background:#1a304b;border:1px solid #47688b;border-radius:9px;padding:12px;position:relative}.step:not(:last-child):after{content:'→';position:absolute;right:-12px;top:40%;color:#9dd1ff}.step p{font-size:12px;margin:7px 0}.chip{background:#305276;border:1px solid #56799b;color:#fff;border-radius:5px;padding:2px 5px;margin:2px;cursor:pointer}.work{display:grid;grid-template-columns:210px minmax(480px,1fr) 390px}aside,main,.detail{padding:15px;min-width:0}aside{border-right:1px solid #344c67}main{overflow:auto}.detail{border-left:1px solid #344c67;background:#101e32}input,select{width:100%;padding:9px;margin-bottom:10px;background:#192d47;color:#fff;border:1px solid #506f8f;border-radius:6px}.list{max-height:700px;overflow:auto}.list button{display:block;width:100%;background:none;border:0;color:#dcecff;text-align:left;padding:6px 8px;border-radius:5px;cursor:pointer;overflow-wrap:anywhere}.list button:hover,.list button.active{background:#2b4c70}.diagram{min-width:760px}.diagram svg{width:100%;height:auto}.node{fill:#1d3856;stroke:#6c94b8;stroke-width:1.5;cursor:pointer}.node.external{fill:#263243;stroke:#9baabd;stroke-dasharray:5 3}.node.selected{fill:#326389;stroke:#cae8ff;stroke-width:2.5}.node-title{fill:#fff;font-size:12px;font-weight:600;pointer-events:none}.node-meta{fill:#bad5ec;font-size:10px;pointer-events:none}.edge{fill:none;stroke:#8fbfe6;stroke-width:1.6;marker-end:url(#arrow)}.edge.inferred{stroke:#e9b582;stroke-dasharray:5 4;marker-end:url(#arrow2)}.edge-label{fill:#e9f6ff;font-size:9px;paint-order:stroke;stroke:#0a1423;stroke-width:3px}.legend{font-size:12px;color:#b6cadc;margin-bottom:9px}.legend span{margin-right:14px}.line{display:inline-block;width:20px;border-top:2px solid #8fbfe6;vertical-align:middle;margin-right:5px}.line.dash{border-style:dashed;border-color:#e9b582}.card{background:#1a2d46;border:1px solid #3a5673;border-radius:8px;padding:11px;margin-bottom:10px}.card p{margin:5px 0}.badge{display:inline-block;font-size:10px;background:#365c80;border-radius:4px;padding:1px 4px;margin:1px 2px 1px 0}.badge.fk{background:#4e5f91}.badge.uq{background:#536d5e}.badge.nn{background:#775340}.connection{border-bottom:1px solid #3a5673;padding:7px 0}.connection:last-child{border:0}.connection button{background:none;border:0;color:#a9d5ff;cursor:pointer;text-align:left;padding:0;font:inherit}.source{display:inline-block;font-size:11px;margin:3px 6px 2px 0}a{color:#9fd5ff;text-decoration:none}a:hover{text-decoration:underline}table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #3a5673;padding:5px 3px;overflow-wrap:anywhere}td.type{max-width:135px}.empty{padding:20px;color:#b5c8da}@media(max-width:1100px){.work{grid-template-columns:195px 1fr}.detail{grid-column:1/3;border-left:0;border-top:1px solid #344c67}}@media(max-width:650px){.work{display:block}}

.diagram{max-width:100%;overflow-x:auto}.diagram svg{min-width:850px}td:first-child strong{display:block}td:first-child .source{display:block;overflow-wrap:anywhere}.edge-label{font-size:10px}
@media(max-width:1450px){.work{grid-template-columns:210px minmax(0,1fr)}.detail{grid-column:1/3;border-left:0;border-top:1px solid #344c67}}
@media(max-width:650px){.work{display:flex;flex-direction:column}aside{max-height:210px;overflow:hidden}.list{max-height:140px;overflow:auto}main{order:2}.detail{order:3}}
@media(prefers-color-scheme:light){:root{color:#17283b;background:#f3f7fb}header,.story{background:#e5eef8;border-color:#b8cada}p,.muted,.meta,.legend{color:#486176}.step,.card{background:#fff;border-color:#b8cada}.step strong,h3{color:#203b56}aside,.detail{background:#f7fbff;border-color:#b8cada}input,select{background:#fff;color:#17283b;border-color:#9eb5cc}.list button{color:#203b56}.list button:hover,.list button.active{background:#dceafa}.chip{background:#dceafa;color:#173a60}.node{fill:#e5f0fa;stroke:#628bad}.node.external{fill:#eef2f7;stroke:#899db1}.node.selected{fill:#cce4f7}.node-title{fill:#18344e}.node-meta{fill:#486b87}.edge-label{fill:#173a5b;stroke:#f7fbff}th,td,.connection{border-color:#bfd0df}a,.connection button{color:#07558f}.badge{color:#fff}.warn{background:#f9dfd3;color:#70361e}}
</style></head><body><header><h1>Schema explorer</h1><div id="subtitle" class="meta"></div><div id="warnings"></div></header><section class="story"><h2>How data moves</h2><div id="pipeline" class="steps"></div></section><div class="work"><aside><input id="search" type="search" placeholder="Search tables or columns"><div id="count" class="meta"></div><div id="list" class="list"></div></aside><main><h2 id="groupname"></h2><select id="groupselect"></select><div class="legend"><span><i class="line"></i>Declared FK · child → parent</span><span><i class="line dash"></i>Evidenced connection</span></div><div class="diagram"><svg id="graph" role="img" aria-label="Schema relationships"></svg></div><p class="meta">Dashed boxes link to tables in other areas. Arrow labels show child-to-parent cardinality; 0..1 means the FK column is nullable.</p></main><section id="detail" class="detail"><div class="empty">Select a table or a pipeline step.</div></section></div><script id="data" type="application/json">__SCHEMA_DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),T=Object.fromEntries(D.tables.map(t=>[t.name,t]));let chosen=null,group=0;
const $=id=>document.getElementById(id),el=(tag,text='',cls='')=>{const x=document.createElement(tag);x.textContent=text;x.className=cls;return x},svg=(tag,attrs={})=>{const x=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);return x};
function source(loc){const a=el('a',loc,'source'),m=loc.match(/^(.*):(\d+)$/);if(m&&D.source_base){const base=new URL(D.source_base+'/',location.href);a.href=new URL(m[1],base).href+'#L'+m[2]};return a}function sources(box,ls){for(const x of ls||[])box.append(source(x))}
function select(n){chosen=n;const i=D.groups.findIndex(g=>g.includes(n));if(i!==group)setGroup(i);draw();detail();list()}function setGroup(i){group=i;$('groupselect').value=String(i);$('groupname').textContent=D.group_labels[i]+' · '+D.groups[i].length+' tables';draw()}
function list(){const q=$('search').value.toLowerCase().trim(),found=D.tables.filter(t=>t.name.includes(q)||t.columns.some(c=>c.name.includes(q)));$('count').textContent=found.length+' of '+D.tables.length+' tables';$('list').replaceChildren();for(const t of found){const b=el('button',t.name,t.name===chosen?'active':'');b.onclick=()=>select(t.name);$('list').append(b)}}
function story(){if(!D.pipeline.length){$('pipeline').append(el('p','Pipeline not verified. Confirm with the project owner.'));return}D.pipeline.forEach((s,i)=>{const box=el('div','','step');box.append(el('strong',(i+1)+'. '+s.title),el('p',s.summary));for(const n of s.tables){const b=el('button',n,'chip');b.onclick=()=>select(n);box.append(b)}const cites=el('div','','meta');sources(cites,s.evidence);box.append(cites);$('pipeline').append(box)})}
function keySummary(t){const pk=t.constraints.filter(x=>x.kind==='PRIMARY KEY').flatMap(x=>x.columns),fk=D.edges.filter(x=>x.kind==='declared'&&x.from===t.name).flatMap(x=>x.columns);return (pk.length?'PK '+pk.slice(0,2).join(', '):'')+(fk.length?(pk.length?' · ':'')+'FK '+fk.slice(0,2).join(', '):'')}
function draw(){
 const box=$('graph'),core=D.groups[group],edges=D.edges.filter(e=>core.includes(e.from)||core.includes(e.to));
 const outer=[...new Set(edges.flatMap(e=>[e.from,e.to]).filter(n=>!core.includes(n)))].sort(),pos={};
 box.replaceChildren();core.forEach((n,i)=>pos[n]={x:18+(i%2)*275,y:72+Math.floor(i/2)*112});
 outer.forEach((n,i)=>pos[n]={x:594,y:72+i*112});
 box.setAttribute('viewBox',`0 0 850 ${Math.max(130,Math.ceil(core.length/2)*112,outer.length*112)+80}`);
 const defs=svg('defs');for(const [id,color] of [['arrow','#8fbfe6'],['arrow2','#e9b582']]){
  const m=svg('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
  m.append(svg('path',{d:'M0 0 L10 5 L0 10 z',fill:color}));defs.append(m)
 }box.append(defs);
 edges.forEach((e,i)=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;
  const blocked=Math.abs(a.x-b.x)>400||(a.x===b.x&&a.y!==b.y);
  let path,labelX,labelY;
  if(blocked){const sx=a.x+112,tx=b.x+112,lane=18+(i%5)*10;
   path=`M${sx} ${a.y} L${sx} ${lane} L${tx} ${lane} L${tx} ${b.y}`;
   labelX=(sx+tx)/2;labelY=lane-4;
  }else{const forward=a.x<=b.x,x1=forward?a.x+225:a.x,x2=forward?b.x:b.x+225,y1=a.y+42,y2=b.y+42,bend=forward?35:-35;
   path=`M${x1} ${y1} C${x1+bend} ${y1} ${x2-bend} ${y2} ${x2} ${y2}`;
   labelX=(x1+x2)/2;labelY=(y1+y2)/2-5;
  }
  const p=svg('path',{d:path,class:'edge '+(e.kind==='inferred'?'inferred':'')});
  const tip=svg('title');tip.textContent=e.from+'.'+(e.columns||[]).join(', ')+' → '+e.to+'.'+(e.target_columns||[]).join(', ');p.append(tip);box.append(p);
  if(e.cardinality){const label=svg('text',{x:labelX,y:labelY,class:'edge-label'});label.setAttribute('text-anchor','middle');label.textContent=e.cardinality;box.append(label)}
 });
 for(const n of [...core,...outer]){const p=pos[n],t=T[n],g=svg('g'),r=svg('rect',{x:p.x,y:p.y,width:225,height:85,rx:9,class:'node '+(outer.includes(n)?'external ':'')+(chosen===n?'selected':'')}),title=svg('text',{x:p.x+11,y:p.y+24,class:'node-title'}),keys=svg('text',{x:p.x+11,y:p.y+48,class:'node-meta'}),foot=svg('text',{x:p.x+11,y:p.y+68,class:'node-meta'});title.textContent=n.length>29?n.slice(0,27)+'…':n;const ks=keySummary(t);keys.textContent=ks.length>34?ks.slice(0,32)+'…':ks;foot.textContent=outer.includes(n)?'linked area · open table':t.columns.length+' columns · open table';const tip=svg('title');tip.textContent=n+' · '+ks;g.append(r,title,keys,foot,tip);g.onclick=()=>select(n);box.append(g)}
}
function badge(v,cls=''){return el('span',v,'badge '+cls)}function detail(){const box=$('detail');box.replaceChildren();if(!chosen)return;const t=T[chosen],p=D.purposes[chosen];box.append(el('h2',t.name));const purpose=el('div','','card');purpose.append(el('h3','Purpose'),el('p',p?p.text:'Confirm with the project owner'));if(p)sources(purpose,p.evidence);box.append(purpose);const card=el('div','','card'),tab=el('table'),h=el('tr');card.append(el('h3','Columns and constraints'));for(const x of ['Column','Type','Rules'])h.append(el('th',x));tab.append(h);const pk=new Set(t.constraints.filter(x=>x.kind==='PRIMARY KEY').flatMap(x=>x.columns)),uq=new Set(t.constraints.filter(x=>x.kind==='UNIQUE'&&x.columns.length===1).flatMap(x=>x.columns)),fk=new Set(D.edges.filter(x=>x.kind==='declared'&&x.from===t.name).flatMap(x=>x.columns));for(const c of t.columns){const row=el('tr'),a=el('td'),b=el('td',c.type,'type'),rules=el('td');a.append(el('strong',c.name),source(c.loc));if(pk.has(c.name))rules.append(badge('PK'));if(fk.has(c.name))rules.append(badge('FK','fk'));if(uq.has(c.name))rules.append(badge('UNIQUE','uq'));if(c.not_null)rules.append(badge('NOT NULL','nn'));if(c.default)rules.append(el('div','default '+c.default,'muted'));row.append(a,b,rules);tab.append(row)}card.append(tab);box.append(card);const keys=el('div','','card');keys.append(el('h3','Keys and indexes'));if(!t.constraints.length)keys.append(el('p','None declared here.','muted'));for(const k of t.constraints){const row=el('div');row.append(badge(k.kind,k.kind==='UNIQUE'?'uq':''),el('span',(k.expression||k.columns.join(', '))+' '),source(k.loc));keys.append(row)}box.append(keys);const connections=el('div','','card'),es=D.edges.filter(e=>e.from===chosen||e.to===chosen);connections.append(el('h3','Connections · '+es.length));if(!es.length)connections.append(el('p','No evidenced connections.','muted'));for(const e of es){const other=e.from===chosen?e.to:e.from,line=el('div','','connection'),b=el('button',e.from+'.'+(e.columns||[]).join(', ')+' → '+e.to+'.'+(e.target_columns||[]).join(', '));b.onclick=()=>select(other);line.append(b,el('div',(e.kind==='inferred'?'Evidenced in code':e.declaration||'FOREIGN KEY')+(e.cardinality?' · '+e.cardinality:'')+(e.on_delete?' · ON DELETE '+e.on_delete:''),'meta'),source(e.loc));connections.append(line)}box.append(connections);const refs=el('div','','card');refs.append(el('h3','Repository references'));sources(refs,D.references[chosen]||[]);box.append(refs);const src=el('div','','card');src.append(el('h3','SQL definition'),source(t.loc));if(t.comment)src.append(el('p',t.comment));box.append(src)}
$('subtitle').textContent=D.schema+' · '+D.tables.length+' tables · '+D.edges.filter(x=>x.kind==='declared').length+' declared relationships';if(D.warnings.length)$('warnings').append(el('div','Schema may be incomplete: '+D.warnings.join(' | '),'warn'));D.groups.forEach((g,i)=>{const o=el('option',D.group_labels[i]+' · '+g.length+' tables');o.value=String(i);$('groupselect').append(o)});$('groupselect').onchange=e=>setGroup(Number(e.target.value));$('search').oninput=list;story();setGroup(0);list();
</script></body></html>
