function showDetail(){const box=$('sw-detail');box.replaceChildren();if(!chosen){box.append(el('p','Select a table to inspect columns, keys, and connections.','sw-empty'));return}const table=T[chosen],purpose=D.purposes[chosen],left=el('div','','sw-card'),right=el('div','','sw-card');left.append(el('h2',table.name),el('p',purpose?purpose.text:'Purpose not verified. Confirm with the project owner.','sw-muted'));if(purpose)addSources(left,purpose.evidence);const wrap=el('div','','sw-table-wrap'),grid=el('table'),head=el('tr');['Column','Type','Rules'].forEach(text=>head.append(el('th',text)));grid.append(head);const pk=new Set(table.constraints.filter(x=>x.kind==='PRIMARY KEY').flatMap(x=>x.columns)),fk=new Set(D.edges.filter(x=>x.kind==='declared'&&x.from===table.name).flatMap(x=>x.columns));table.columns.forEach(column=>{const row=el('tr'),rules=[];if(pk.has(column.name))rules.push('PK');if(fk.has(column.name))rules.push('FK');if(column.not_null)rules.push('NOT NULL');if(column.default)rules.push('DEFAULT '+column.default);row.append(el('td',column.name),el('td',column.type),el('td',rules.join(' · ')||'—'));grid.append(row)});wrap.append(grid);left.append(wrap);const connections=D.edges.filter(edge=>edge.from===chosen||edge.to===chosen);right.append(el('h3','Connections · '+connections.length));connections.forEach(edge=>{const line=el('div','','sw-recommendation'),button=el('button',edge.from+'.'+(edge.columns||[]).join(', ')+' → '+edge.to+'.'+(edge.target_columns||[]).join(', '),'sw-table-button');button.type='button';button.onclick=()=>selectTable(edge.from===chosen?edge.to:edge.from);line.append(button,el('p',(edge.kind==='inferred'?'Evidenced in code':edge.declaration||'Foreign key')+(edge.cardinality?' · '+edge.cardinality:''),'sw-muted'));right.append(line)});right.append(el('h3','Repository references'));addSources(right,D.references[chosen]||[]);box.append(left,right)}
